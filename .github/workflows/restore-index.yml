name: Restore index.html

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy public page to index.html
        run: cp post-everywhere-public-page.html index.html
      - name: Commit index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore index.html from post-everywhere-public-page.html"
          git push
